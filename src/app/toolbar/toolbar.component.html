<div class="app-toolbar">

  <!-- Left -->

  <div class="app-toolbar-left">

    <div class="toolbar-group">

      <button class="toolbar-btn" type="button" title="Select" (click)="selectTool(Tool.SELECT)" [class.active]="
          whiteboard.activeTool() === Tool.SELECT
        ">
        <i class="bi bi-cursor"></i>
      </button>

      <button class="toolbar-btn" type="button" title="Pen" (click)="selectTool(Tool.PEN)" [class.active]="
          whiteboard.activeTool() === Tool.PEN
        ">
        <i class="bi bi-pencil"></i>
      </button>

      <button class="toolbar-btn" type="button" title="Highlighter" (click)="selectTool(Tool.HIGHLIGHTER)"
        [class.active]="
          whiteboard.activeTool() === Tool.HIGHLIGHTER
        ">
        <i class="bi bi-highlighter"></i>
      </button>

      <button class="toolbar-btn" type="button" title="Eraser" (click)="selectTool(Tool.ERASER)" [class.active]="
          whiteboard.activeTool() === Tool.ERASER
        ">
        <i class="bi bi-eraser"></i>
      </button>

    </div>

    <span class="toolbar-separator"></span>

    <div class="toolbar-group">

      <button class="toolbar-btn" type="button" title="Line" (click)="selectTool(Tool.LINE)" [class.active]="
          whiteboard.activeTool() === Tool.LINE
        ">
        <i class="bi bi-slash-lg"></i>
      </button>

      <button class="toolbar-btn" type="button" title="Rectangle" (click)="selectTool(Tool.RECTANGLE)" [class.active]="
          whiteboard.activeTool() === Tool.RECTANGLE
        ">
        <i class="bi bi-square"></i>
      </button>

      <button class="toolbar-btn" type="button" title="Circle" (click)="selectTool(Tool.CIRCLE)" [class.active]="
          whiteboard.activeTool() === Tool.CIRCLE
        ">
        <i class="bi bi-circle"></i>
      </button>

      <button class="toolbar-btn" type="button" title="Arrow" (click)="selectTool(Tool.ARROW)" [class.active]="
          whiteboard.activeTool() === Tool.ARROW
        ">
        <i class="bi bi-arrow-up-right"></i>
      </button>

      <button class="toolbar-btn" type="button" title="Text" (click)="selectTool(Tool.TEXT)" [class.active]="
          whiteboard.activeTool() === Tool.TEXT
        ">
        <i class="bi bi-type"></i>
      </button>

    </div>

    <span class="toolbar-separator"></span>

    <div class="toolbar-group">

      <div class="toolbar-dropdown color-picker">

        <button class="toolbar-btn color-btn" type="button" title="Color" (click)="toggleColorPickerMenu()"
          [class.active]="isColorPickerOpen" [attr.aria-expanded]="isColorPickerOpen">
          <span class="current-color" [style.background-color]="selectedColor"></span>
        </button>

        @if (isColorPickerOpen) {

        <div class="dropdown-menu color-menu">

          <div class="color-grid">

            @for (color of predefinedColors; track color) {

            <button type="button" class="color-option" [class.selected]="selectedColor === color"
              [style.background-color]="color" [attr.aria-label]="'Select color ' + color" [title]="color"
              (click)="selectColor(color)">
            </button>

            }

            <!-- Custom color -->
            <label class="color-option custom-color" title="Custom color" (click)="$event.stopPropagation()">
              <i class="bi bi-eyedropper"></i>
              <input type="color" [value]="selectedColor" (change)="selectCustomColor($event)"
                (click)="$event.stopPropagation()" aria-label="Choose custom color" />
            </label>

          </div>

        </div>

        }

      </div>

    </div>

  </div>


  <!-- Right -->

  <div class="app-toolbar-right">

    <div class="toolbar-group">

      <button class="toolbar-btn" type="button" title="Undo" (click)="undo()">
        <i class="bi bi-arrow-counterclockwise"></i>
      </button>

      <button class="toolbar-btn" type="button" title="Redo" (click)="redo()">
        <i class="bi bi-arrow-clockwise"></i>
      </button>

    </div>

    <span class="toolbar-separator"></span>

    <div class="toolbar-group">

      <button class="toolbar-btn" type="button" title="Zoom Out" (click)="zoomOut()">
        <i class="bi bi-dash-lg"></i>
      </button>

      <span class="toolbar-zoom">
        {{ whiteboard.zoom() * 100 | number:'1.0-0' }}%
      </span>

      <button class="toolbar-btn" type="button" title="Zoom In" (click)="zoomIn()">
        <i class="bi bi-plus-lg"></i>
      </button>

    </div>

    <span class="toolbar-separator"></span>


    <!-- Avatar -->

    <button class="toolbar-btn avatar-btn" type="button" title="Profile">
      <img src="https://placehold.co/400" alt="Profile" class="avatar">
    </button>

    <span class="toolbar-separator"></span>


    <!-- More -->

    <div class="toolbar-dropdown">

      <button class="toolbar-btn" type="button" title="More" (click)="toggleMoreMenu()" [class.active]="isMoreMenuOpen"
        [attr.aria-expanded]="isMoreMenuOpen">
        <i class="bi bi-three-dots"></i>
      </button>

      @if (isMoreMenuOpen) {

      <div class="dropdown-menu">

        <button class="dropdown-item" type="button" (click)="clearCanvas()">
          <i class="bi bi-trash3"></i>
          <span>Clear canvas</span>
        </button>

        <button class="dropdown-item" type="button" (click)="exportCanvas()">
          <i class="bi bi-download"></i>
          <span>Export</span>
        </button>

        <label class="dropdown-item" for="whiteboard-import">
          <i class="bi bi-upload"></i>
          <span>Import</span>
        </label>

        <input id="whiteboard-import" type="file" accept=".json,application/json" hidden
          (change)="importCanvas($event)">

        <div class="dropdown-divider"></div>

        <button class="dropdown-item" type="button" (click)="toggleGrid()">
          <i class="bi bi-grid-3x3"></i>

          <span>
            {{ whiteboard.showGrid()
            ? 'Hide grid'
            : 'Show grid'
            }}
          </span>
        </button>

        <button class="dropdown-item" type="button">
          <i class="bi bi-arrows-fullscreen"></i>
          <span>Fullscreen</span>
        </button>

        <div class="dropdown-divider"></div>

        <button class="dropdown-item" type="button">
          <i class="bi bi-gear"></i>
          <span>Settings</span>
        </button>

      </div>

      }

    </div>

  </div>

</div>
